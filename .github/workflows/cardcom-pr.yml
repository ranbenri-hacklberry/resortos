name: Test and Build PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/*, fix/*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: hotelos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/hotelos_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Type-check and test resortos-agent pipeline
        run: |
          npm --prefix services/resortos-agent ci
          npm --prefix services/resortos-agent run typecheck
          npm --prefix services/resortos-agent test src/pipelineOtherPending.test.ts src/wrongQr20261022.test.ts src/chloeKulam20261028.test.ts

      - name: Run PostgreSQL Integration Tests
        if: always()
        run: node --test server/cardcomPostgres.test.js

      - name: Build Guest Portal
        run: npm run build:guest
