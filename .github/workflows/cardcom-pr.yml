name: Test and Build PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/*, fix/*]
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Guest Portal
        run: npm run build:guest
