name: Deploy resortos.app

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-resortos-app
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore Cloudflare login
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WRANGLER_OAUTH: ${{ secrets.CLOUDFLARE_WRANGLER_OAUTH }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Using CLOUDFLARE_API_TOKEN"
          elif [ -n "$CLOUDFLARE_WRANGLER_OAUTH" ]; then
            mkdir -p "$HOME/.config/.wrangler/config"
            mkdir -p "$HOME/.wrangler/config"
            printf '%s\n' "$CLOUDFLARE_WRANGLER_OAUTH" > "$HOME/.config/.wrangler/config/default.toml"
            printf '%s\n' "$CLOUDFLARE_WRANGLER_OAUTH" > "$HOME/.wrangler/config/default.toml"
            chmod 600 "$HOME/.config/.wrangler/config/default.toml" "$HOME/.wrangler/config/default.toml"
          else
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_WRANGLER_OAUTH"
            exit 1
          fi

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:guest
