# Copy this file onto the phone. Do not put real tokens in git.
# adb push kiosk.properties /sdcard/Android/data/il.resortos.kiosk/files/kiosk.properties
#
# kiosk.local.token   shared with the ESP32 only. 16+ random characters.
# kiosk.server.token  same value as the server env CARDCOM_KIOSK_TOKEN.
#                     This is not CARDCOM_API_PASSWORD.
# kiosk.api.base      ResortOS origin. https only (http allowed on a debug build).
# kiosk.listen.port   LAN port. Default 8765. Must be >= 1024.
# kiosk.payments.mode mock (default) or live.
#                     live refuses to run until the Cardcom AAR is in app/libs
#                     and the server token is set.

kiosk.local.token=
kiosk.server.token=
kiosk.api.base=https://resortos.app
kiosk.listen.port=8765
kiosk.payments.mode=mock
